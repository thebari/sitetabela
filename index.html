<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Tabela</title>

  <style>
    table,
    th,
    td {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid #ccc;
    }

    #header {
      background-color: #4CAF50;
      color: white;
      font-size: 30px;
    }

    #subtitle {
      background-color: #1a4d10;
      color: white;
      font-size: 16px;
    }

    #menu {
      background-color: #e6e6e6;
    }
  </style>
</head>

<body>
  <table>

    <tr>
      <th colspan="2" id="header"> Meu Site </th>
    </tr>

    <tr>
      <th colspan="2" id="subtitle"> Usando Tabelas em Html </th>
    </tr>


    <td>
      <table>
        Menu
          <ul>
            <li> Inicio </li>
            <li> Sobre </li>
            <li> Serviços </li>
            <li> Contato </li>
          </ul>
      </table>
      </td>

    <td>
      Bem vindo!
      <hr>
      Esse é um exemplo de site criado utilizando tabelas
      Antigamente, Esse era um método comum para estruturar páginas.
    </td>

    </tr>
    <tr>
      <th colspan="2"> 2026 - Site do Bernardo</th>
    </tr>

  </table>
</body>

</html>
