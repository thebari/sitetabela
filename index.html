<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site Tabela</title>

    <style>
      table,
      th,
      td,
      tr {
        border-collapse: collapse;
        border: 2px solid #cdd3d8;
      }

      #conteudo {
      }

      #header {
        background-color: #318247;
        color: white;
        font-size: 40px;
      }

      #subtitle {
        background-color: #1c5a34;
        color: white;
        font-size: 18px;
      }

      #menu th {
        background-color: #dcdfe2;
      }

      #menu table {
        background-color: #eeeff0;
      }

      #rodape {
        background-color: #edeef0;
      }
    </style>
  </head>

  <body>
    <table id="table">
      <div>
        <tr>
          <th colspan="2" id="header">Meu Site</th>
        </tr>

        <tr>
          <th colspan="2" id="subtitle">Usando Tabelas em Html</th>
        </tr>
      </div>

      <main id="main">
        <tr id="menu">
          <td>
            <table>
              <tr>
                <th>Menu</th>
              </tr>
              <tr>
                <td>
                  <ul>
                    <li><a href="">Início</a></li>
                    <li><a href="">Sobre</a></li>
                    <li><a href="">Serviços</a></li>
                    <li><a href="">Contato</a></li>
                  </ul>
                </td>
              </tr>
            </table>
          </td>

          <td>
            <b>Bem vindo!</b>
            <hr />
            Esse é um exemplo de site criado utilizando tabelas Antigamente,
            Esse era um método comum para estruturar páginas.
          </td>
        </tr>
      </main>

      <tr id="rodape">
        <th colspan="2">© 2026 - Site do Bernardo</th>
      </tr>
    </table>
  </body>
</html>
